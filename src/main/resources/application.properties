# Conexion a la base de datos local (seccion 5.3 del informe)
spring.datasource.url=jdbc:mysql://localhost:3306/logitrack
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

server.port=8080

# JWT (clave de desarrollo; cambiar por una real y por variable de entorno antes del despliegue del Capitulo 8)
jwt.secret=cambia-esta-clave-por-una-propia-de-al-menos-32-caracteres
jwt.expiration-ms=86400000
