# Configuracion de LogiTrack (seccion 5.3 y Capitulo 8 del informe).
# Cada valor sensible o que cambia entre entornos se lee de una variable de entorno;
# el valor despues de ":" es el que se usa en desarrollo local si la variable no existe.

# --- Base de datos MySQL ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/logitrack}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# En local "update" crea y ajusta las tablas. En produccion se usa "update" solo en el
# primer despliegue (para crear el esquema en la base vacia) y luego "validate".
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${SHOW_SQL:true}

# --- Servidor --- (Render asigna el puerto en la variable PORT)
server.port=${PORT:8080}

# --- JWT --- RNF-01: el token expira a las 8 horas (28 800 000 ms), una jornada laboral.
jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-propia-de-al-menos-32-caracteres}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# --- CORS --- RNF-05: solo el dominio del frontend puede llamar a la API.
# Varias URL se separan con coma, por ejemplo: http://localhost:4200,https://logitrack.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Swagger / OpenAPI (Capitulo 7) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
